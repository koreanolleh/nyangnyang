<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design:Gym</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body { height:100%; background:transparent; }
  body {
    font-family:-apple-system, "Apple SD Gothic Neo", BlinkMacSystemFont, sans-serif;
    display:flex; align-items:center;
  }
  .card {
    width:100%; height:100%;
    display:flex; align-items:center; gap:14px;
    padding:14px 18px;
    background:#FFFFFF;
    border-radius:16px;
  }
  .info { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .name {
    font-size:17px; font-weight:600; letter-spacing:-.4px; color:#1A1A18;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hint {
    display:inline-flex; align-items:center; gap:5px;
    font-size:14px; font-weight:500; letter-spacing:-.3px; color:#8A8478;
  }
  .hint svg { width:15px; height:15px; flex:none; }
  .price { font-size:20px; font-weight:700; letter-spacing:-.5px; color:#1A1A18; }
  .price s { font-size:14px; font-weight:400; color:#B0AAA0; margin-right:7px; }
  .cta {
    flex:none;
    display:flex; align-items:center; justify-content:center;
    height:46px; padding:0 22px;
    background:#1A1A18; color:#fff;
    font-size:16px; font-weight:600; letter-spacing:-.3px;
    border-radius:23px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="info">
      <div class="name" id="name">디자인짐 인테리어 요가매트</div>
      <div class="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="4.4"/><path d="M6.6 15.2A9 9 0 0 0 12 21a9 9 0 0 0 5.4-5.8"/></svg>
        <span>매트를 탭하면 색상이 바뀝니다</span>
      </div>
      <div class="price" id="price"></div>
    </div>
    <div class="cta">구매하기</div>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var n = q.get('t'), p = q.get('p'), o = q.get('o');
    if (n) document.getElementById('name').textContent = n;
    var el = document.getElementById('price');
    el.innerHTML = (o ? '<s>' + o + '</s>' : '') + (p || '');
  })();
</script>
</body>
</html>
